[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "migration-oracle"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "anyio>=4.0",
    "langchain>=0.2",
    "langchain-community>=0.2",
    "sentence-transformers>=3.0",
    "mcp>=1.0",
    "streamlit>=1.35",
    "click>=8.1",
    "rapidfuzz>=3.0",
    "packaging>=24.0",
    "structlog>=24.0",
    "langchain-anthropic>=1.4.4",
    "langchain-ollama>=1.1.0",
    "pyyaml>=6.0",
    "langchain-openai>=1.0",
    "tqdm>=4.66",
    # Parser for the scanner's TS / JS extraction (spec 026.3). Prebuilt wheels
    # for CPython 3.11+, so no compiler is needed.
    # <0.26: py-tree-sitter 0.26.0 segfaults in Node access on larger files
    # (an 800-line spec file is enough; 0.24 / 0.25 are fine). Guarded by
    # tests/scanner/test_ts_native_stability.py.
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.25",
    # Parser for the scanner's Java extraction (spec 026.7). Prebuilt wheels.
    "tree-sitter-java>=0.23",
]

[project.scripts]
migration-oracle = "migration_oracle.cli:main"
export-extract-populate-framework = "migration_oracle.cli:export_extract_populate_framework"
migration-scan = "migration_planner.scanner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["migration_oracle", "migration_planner", "migration_keys"]

[tool.uv]
package = true
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
