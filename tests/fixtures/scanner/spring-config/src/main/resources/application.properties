# Comments start with '#' or '!', and both separators a Java properties file
# allows are used below: '=' on most lines, ':' here.
spring.application.name=config-svc
server.port: 8080

# FR-8a: relaxed binding turns authenticationDatabase into authentication-database.
spring.data.mongodb.uri=mongodb://localhost:27017/shop
spring.data.mongodb.authenticationDatabase=admin

# A credential: the value must never reach the profile.
spring.datasource.url=jdbc:postgresql://shop_user:s3cret@db.internal:5432/shop
spring.datasource.password=s3cret
spring.datasource.hikari.maximum-pool-size=20

# A map-valued prefix: everything after "level" is a logger name, as written.
logging.level.com.acme.shop.web.CatalogController=DEBUG
logging.level.root=INFO

# A placeholder is a reference, not a secret, so it is kept as written.
spring.datasource.username=${DB_USER}

# Values are truncated to 200 characters, and long ones stay one line.
app.banner=Welcome to the shop

# A continuation line, and a \u escape.
app.description=config \
    service
app.greeting=caf\u00e9
